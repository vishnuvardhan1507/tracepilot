services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracepilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracepilot_dev}
      POSTGRES_DB: tracepilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracepilot"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://tracepilot:${POSTGRES_PASSWORD:-tracepilot_dev}@db:5432/tracepilot
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tracepilot.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:5173,http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
  web:
    build: .
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
volumes:
  postgres_data:
